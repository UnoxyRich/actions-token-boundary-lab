name: cross-repo-token-boundary
on: [workflow_dispatch]
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Probe another owned private repository
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          status=$(curl --silent --show-error --output /tmp/private-response.json --write-out '%{http_code}' --header "Authorization: Bearer $GH_TOKEN" --header "Accept: application/vnd.github+json" --header "X-GitHub-Api-Version: 2022-11-28" "https://api.github.com/repos/UnoxyRich/actions-private-boundary-lab/contents/sentinel.txt")
          echo "private_repo_status=$status"
          if [[ "$status" == "200" ]]; then
            python3 -c "import base64,json; data=json.load(open('/tmp/private-response.json')); print('private_sentinel='+base64.b64decode(data['content']).decode().strip())"
          fi
