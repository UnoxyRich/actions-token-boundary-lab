name: cross-repo-token-boundary
on: [workflow_dispatch]
permissions:
  actions: read
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Try restoring private-repository cache
        id: private-cache
        uses: actions/cache@v4
        with:
          path: cache-data
          key: actions-cross-repo-private-sentinel-20261014
      - name: Report cache result
        run: |
          echo "private_cache_hit=${{ steps.private-cache.outputs.cache-hit }}"
          if [[ -f cache-data/sentinel.txt ]]; then
            echo "private_cache_sentinel=$(cat cache-data/sentinel.txt)"
          fi
      - name: Probe another owned private repository artifact
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          status=$(curl --silent --show-error --output /tmp/private-artifacts.json --write-out '%{http_code}' --header "Authorization: Bearer $GH_TOKEN" --header "Accept: application/vnd.github+json" --header "X-GitHub-Api-Version: 2022-11-28" "https://api.github.com/repos/UnoxyRich/actions-private-boundary-lab/actions/runs/38573346496/artifacts")
          echo "private_artifact_api_status=$status"
