name: artifact-attestation-boundary
on:
  workflow_dispatch:
permissions:
  contents: read
  id-token: write
  attestations: write
  artifact-metadata: write
jobs:
  attest:
    runs-on: ubuntu-latest
    steps:
      - name: Create harmless test subject
        run: printf 'owned-attestation-probe-v1\n' > artifact.txt
      - name: Generate signed provenance
        uses: actions/attest@v4
        with:
          subject-path: artifact.txt
